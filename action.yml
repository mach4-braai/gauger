name: gauger
description: Samples runner CPU, memory, disk and network during a job and streams them to gauger-server over HTTPS.
author: mach4-braai
branding:
  icon: activity
  color: green
inputs:
  check-run-id:
    description: The job's check run ID, which gauger-server matches the samples on. When empty, it matches on the runner name.
    default: ${{ job.check_run_id }}
  server:
    description: Base URL of gauger-server's runner listener.
    default: https://gauger-server.taila8b8af.ts.net:10000
runs:
  using: node24
  main: src/main.js
  post: src/post.js
