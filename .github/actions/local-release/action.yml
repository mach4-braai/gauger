name: Local gauger release
description: "Builds gauger from this checkout, serves it on 127.0.0.1 and pins it in dist/manifest.json, so that `uses: ./` runs this commit's binary."
runs:
  using: composite
  steps:
    - name: Cache the Go modules and the compiler output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}

    - name: Build, serve and pin the binary
      shell: bash
      run: |
        set -eu
        mise run build
        bin=bin/gauger
        if [ "$RUNNER_OS" = Windows ]; then bin=bin/gauger.exe; fi
        name=$(basename "$bin")
        served="$RUNNER_TEMP/local-release"
        mkdir -p "$served"
        cp "$bin" "$served/$name"
        case "$RUNNER_OS-$(uname -m)" in
          Linux-x86_64) key=linux-x64 ;;
          Linux-aarch64) key=linux-arm64 ;;
          macOS-arm64) key=darwin-arm64 ;;
          Windows-x86_64) key=windows-amd64 ;;
          *) echo "::error::unsupported runner $RUNNER_OS-$(uname -m)"; exit 1 ;;
        esac
        jq -n --arg key "$key" --arg name "$name" --arg sum "$(sha256sum "$bin" | cut -d' ' -f1)" \
          '{version: "local", assets: {($key): {url: "http://127.0.0.1:8765/\($name)", sha256: $sum}}}' >dist/manifest.json
        py=python3
        command -v "$py" >/dev/null 2>&1 || py=python
        nohup "$py" -m http.server 8765 --bind 127.0.0.1 --directory "$served" >/dev/null 2>&1 &
        disown
        for _ in $(seq 50); do curl -fsI "http://127.0.0.1:8765/$name" >/dev/null && exit 0; sleep 0.1; done
        echo "::error::the local release server did not start"
        exit 1
