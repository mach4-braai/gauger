name: Sample

# Streams this commit's gauger to the real gauger-server. The busy and idle
# steps give each step window a known CPU profile to check in the UI.
on:
  pull_request:
    paths:
      - .github/workflows/sample.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    name: sample
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # gauger joins the tailnet and authenticates with OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      - uses: ./.github/actions/local-release # zizmor: ignore[self-repository]

      - uses: ./ # zizmor: ignore[self-repository]

      - name: Busy, rebuild everything
        run: go build -a -o /dev/null ./cmd/gauger

      - name: Idle for 20 s
        run: sleep 20

  # Gives the container cgroup reader a docker-<id>.scope to attribute, so
  # the UI can be checked for container.cpu.time and container.memory.usage
  # next to the runner's own series.
  sample-container:
    name: sample container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # gauger joins the tailnet and authenticates with OIDC
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54 # 16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      - uses: ./.github/actions/local-release # zizmor: ignore[self-repository]

      - uses: ./ # zizmor: ignore[self-repository]

      - name: Load the postgres service container
        run: |
          id=$(docker ps -q --filter ancestor=postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54)
          for i in $(seq 1 20); do
            docker exec "$id" psql -U postgres -c \
              "SELECT count(*) FROM generate_series(1, 2000000) n WHERE n % 7 = 0;"
          done
