name: gauger spike probe
description: Reports what a JavaScript action sees for job.check_run_id and the OIDC request variables.
inputs:
  check-run-id:
    description: The job's check run ID.
    default: ${{ job.check_run_id }}
outputs:
  check-run-id:
    description: The input value as main.js received it.
runs:
  using: node24
  main: main.js
  post: post.js
